<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>La Grilla — motion showcase</title>
<style>html,body{margin:0;background:#0b100d}canvas{display:block} @font-face{font-family:Promo;src:url('/__fonts/regular.ttf')}@font-face{font-family:Promo;src:url('/__fonts/bold.ttf');font-weight:700}</style>
<canvas id="scene" width="1920" height="1080"></canvas>
<script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d',{alpha:false});
const W=1920,H=1080,lime='#d9fa7b',white='#f3f3e9',muted='#aab2a5';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-clamp(v),3);
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
let chapters,images={},envelope=[];
const load=src=>new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=src});
function round(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function text(s,x,y,size=28,color=white,weight=400){g.font=`${weight} ${size}px Promo`;g.fillStyle=color;g.fillText(s,x,y)}
function screen(name,x,y,w,angle=0,alpha=1){const im=images[name],h=w*im.height/im.width;g.save();g.globalAlpha*=alpha;g.translate(x+w/2,y+h/2);g.rotate(angle);g.shadowColor='#0009';g.shadowBlur=60;g.shadowOffsetY=24;round(-w/2-6,-h/2-6,w+12,h+12,45,'#1e281c');g.shadowColor='transparent';g.beginPath();g.roundRect(-w/2,-h/2,w,h,39);g.clip();g.drawImage(im,-w/2,-h/2,w,h);g.restore()}
function background(t,color=lime){g.fillStyle='#0b100d';g.fillRect(0,0,W,H);const glow=g.createRadialGradient(1460,480,50,1460,480,850);glow.addColorStop(0,color+'17');glow.addColorStop(1,'#0b100d00');g.fillStyle=glow;g.fillRect(0,0,W,H);g.strokeStyle='#d9fa7b09';g.lineWidth=1;for(let x=96;x<W;x+=96){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=100;y<H;y+=96){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}const pulse=Math.exp(-((t*2)%1)*6);g.strokeStyle=color+'16';g.lineWidth=2+pulse*2;g.beginPath();g.arc(1490,525,440+pulse*14,0,Math.PI*2);g.stroke()}
function header(){g.save();g.beginPath();g.roundRect(96,54,42,42,11);g.clip();g.drawImage(images.icon,96,54,42,42);g.restore();text('LA GRILLA',153,83,23,white,700);text('POCKET MUSIC STUDIO',330,83,17,muted)}
function waveform(t,x,y,w,color){if(!envelope.length)return;const n=100;for(let i=0;i<n;i++){const at=clamp(t-1.2+i*0.024,0,95.99),v=envelope[Math.min(envelope.length-1,Math.floor(at*30))]||0,h=4+v*70;g.globalAlpha=(i/n)*0.7+0.2;round(x+i*w/n,y-h/2,3,h,2,color)}g.globalAlpha=1}
function footer(t){for(let i=0;i<11;i++){const c=chapters[i],x=96+i*158;round(x,1022,140,3,2,'#333d30');const p=clamp((t-c.start)/(c.end-c.start));if(p>0)round(x,1022,140*p,3,2,i===Math.floor((t-4)/8)?lime:'#657249')}text('iOS 18+ · RU / EN',96,995,17,muted);g.textAlign='right';text('Реальные экраны приложения · motion-показ',1824,1008,17,muted);g.textAlign='left'}
function intro(t,outro=false){const a=ease(t/0.65);g.save();g.globalAlpha=a;const drift=15*Math.sin(t*.5);screen('jam.png',1392,180+drift,330,.13,.45);screen('mixer.png',1030,190-drift,330,-.13,.5);screen('grid.png',1210,97+drift,402,0,1);g.restore();g.save();g.globalAlpha=a;g.translate(0,35*(1-a));text(outro?'ОТ ИДЕИ — К СВОЕМУ ТРЕКУ':'КАРМАННАЯ СТУДИЯ ДЛЯ iPHONE',100,256,22,lime,700);if(outro){text('La Grilla.',96,416,133,white,700);text('Твоя музыка.',96,554,104,lime,700);text('Код и запуск на iPhone',102,673,31,white);text('github.com/alexgazin/la-grilla',102,724,27,muted);text('Предрелизная сборка · App Store — впереди',102,857,21,muted)}else{['Идея.','Грув.','Трек.'].forEach((s,i)=>{g.globalAlpha=a*ease((t-i*.15)/.65);text(s,96,416+i*145,144,i===2?lime:white,700)});g.globalAlpha=a;text('Создавай музыку там, где она приходит.',102,846,30,muted);text('Включи звук · музыка создана движком La Grilla',102,903,21,lime)}g.restore()}
function chapter(c,t,index){const local=t-c.start,p=clamp(local/8),entry=ease(local/.7);g.save();g.globalAlpha=entry;g.translate(50*(1-entry),0);const s=.965+.035*p,sw=414*s,sh=sw*images[c.screen].height/images[c.screen].width;screen(c.screen,1285+(414-sw)/2,535-sh/2+8*Math.sin(p*Math.PI),sw);g.restore();g.save();g.globalAlpha=entry;g.translate(0,35*(1-entry));text(`${String(index+1).padStart(2,'0')} / ${chapters.length}`,100,232,21,c.color,700);text(c.label,250,232,21,c.color,700);c.title.forEach((line,i)=>text(line,96,359+i*106,91,white,700));text(c.subtitle,102,553,31,muted);text(c.detail,102,609,24,c.color);if(c.note)text(c.note,102,662,21,c.color);if(c.crop){const vis=smooth((local-2.0)/.6),im=images[c.screen],x=102,y=727,w=852,h=198;g.globalAlpha=vis*entry;g.save();round(x,y,w,h,22,'#172014');g.beginPath();g.roundRect(x,y,w,h,22);g.clip();const [sx,sy,sourceW,sourceH]=c.crop;const zoom=1+.022*Math.sin(p*Math.PI),scale=Math.max(w/sourceW,h/sourceH)*zoom,dw=sourceW*scale,dh=sourceH*scale;g.drawImage(im,sx,sy,sourceW,sourceH,x-(dw-w)/2,y-(dh-h)/2,dw,dh);g.restore();g.globalAlpha=vis*entry;text('Фрагмент экрана',104,951,15,muted)}else{waveform(t,102,802,850,c.color)}g.restore()}
window.ready=(async()=>{chapters=await(await fetch('/Tools/Promo/chapters.json')).json();const names=[...new Set(['grid.png','jam.png','mixer.png',...chapters.map(c=>c.screen)])];await Promise.all(names.map(async n=>images[n]=await load('/Screenshots/OriginalVision/'+n)));images.icon=await load('/Design/2026/openart-icon.png');await document.fonts.load('400 30px Promo');await document.fonts.load('700 90px Promo');try{envelope=await(await fetch('/__envelope.json')).json()}catch{}return true})();
window.render=t=>{t=clamp(t,0,95.999);const idx=chapters.findIndex(c=>t>=c.start&&t<c.end),c=chapters[idx];background(t,c?.color||lime);header();if(t<4)intro(t);else if(t>=92)intro(t-92,true);else chapter(c,t,idx);footer(t);const transitions=[4,...chapters.map(c=>c.end)];for(const boundary of transitions){const d=t-boundary;if(d>=0&&d<.25){g.fillStyle='#0b100d';g.globalAlpha=1-ease(d/.25);g.fillRect(0,0,W,H);g.globalAlpha=1}}};
</script></html>
