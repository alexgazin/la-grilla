name: Local Xcode build compatibility
on:
  workflow_dispatch:
  push:
    branches: [fix/chord-tile-build]
concurrency:
  group: xcode-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone-build:
    name: ${{ matrix.scope }} / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.2'
            scope: Swift compilation
            excluded_catalog: Assets.xcassets
          - xcode: '16.4'
            scope: Full iPhone app
            excluded_catalog: ''
          - xcode: '26.0.1'
            scope: Full iPhone app
            excluded_catalog: ''
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      GRILLA_EXCLUDED_CATALOG: ${{ matrix.excluded_catalog }}
    steps:
      - uses: actions/checkout@v4
      - name: Record selected compiler and SDK
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Verify project and source configuration
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- LaGrilla.xcodeproj
          python3 scripts/audit_presentation.py
          python3 scripts/release/audit_release.py
      - name: Compile iPhone target with the declared resource scope
        run: |
          set -o pipefail
          # The hosted image lacks the iOS 18.2 runtime required by Xcode
          # 16.2's asset compiler. That row checks actual Swift/C++ source
          # compilation only; 16.4 and 26.x retain every app resource.
          echo "Validation scope: ${{ matrix.scope }}"
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath CompatibilityDerivedData CODE_SIGNING_ALLOWED=NO "EXCLUDED_SOURCE_FILE_NAMES=$GRILLA_EXCLUDED_CATALOG" build | tee compatibility-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-${{ matrix.xcode }}-iphone-build-log
          path: compatibility-build.log
