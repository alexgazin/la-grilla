{
  "name": "Read original Nocturne Jam PNG for visual review",
  "on": {
    "push": {
      "branches": [
        "feat/design26-evidence"
      ],
      "paths": [
        ".github/workflows/export-design26.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "read": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Read unchanged public original PNG and verify its Git blob",
          "run": "python3 - <<'PY'\nimport urllib.request,hashlib,base64\nurl='https://raw.githubusercontent.com/alexgazin/la-grilla/a314442bd5c4dac8f567e76c1a617705927e120e/Screenshots/Design26/night-jam.png'\nraw=urllib.request.urlopen(url,timeout=30).read()\nassert raw[:8]==b'\\x89PNG\\r\\n\\x1a\\n'\nassert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\0'+raw).hexdigest()=='0613d391ab30dd1ae790ff22ff7b74d75c4a11c1'\nprint('ORIGINAL_JAM_BASE64_BEGIN')\nencoded=base64.b64encode(raw).decode()\nfor start in range(0,len(encoded),12000):print(encoded[start:start+12000])\nprint('ORIGINAL_JAM_BASE64_END')\nPY"
        }
      ]
    }
  }
}
