name: iOS build and verification
on: [push, workflow_dispatch]
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Domain behavioral tests
        run: swift test --package-path Packages/MusicDomain
      - name: Audio kernel tests
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/kernel_test.cpp AudioRuntime/GrillaKernel.cpp -o /tmp/kernel-test && /tmp/kernel-test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build iOS app
        run: set -o pipefail; xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Capture simulator screens
        run: bash scripts/screenshots.sh
      - name: Native user flows
        run: |
          set -o pipefail
          DEVICE=$(cat /tmp/grilla-simulator-id)
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee uitests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: |
            Screenshots/*.png
            build.log
            uitests.log
            TestResults.xcresult
            LaGrilla.xcodeproj
            DerivedData/Build/Products/Debug-iphonesimulator/LaGrilla.app
