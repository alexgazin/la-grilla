name: iOS build and verification
on: [push, workflow_dispatch]
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: "!contains(github.event.head_commit.message, '[device-only]')"
    runs-on: macos-15
    # Full main previously executed 52 methods in 30.4 minutes. Allow 60
    # minutes for native execution, retaining each method's original limit.
    # A shared 75-minute job-clock deadline reserves 15 minutes for diagnostics,
    # partial xcresult export and artifact upload within this 90-minute job.
    timeout-minutes: 90
    steps:
      - name: Reserve time for native evidence preservation
        run: |
          python3 - <<'PY'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'GRILLA_NATIVE_DEADLINE_EPOCH={time.time()+75*60}\n')
          PY
      - uses: actions/checkout@v4
      - name: Verify current App Store toolchain
        run: python3 scripts/release/assert_sdk.py
      - name: Domain behavioral tests
        env:
          GRILLA_VOICE_METRICS: ${{ github.workspace }}/ExportFixtures/voice-metrics.json
          GRILLA_VOICE_FIXTURES: ${{ github.workspace }}/ExportFixtures
          GRILLA_EXPORT_FIXTURES: ${{ github.workspace }}/ExportFixtures
        run: swift test --package-path Packages/MusicDomain
      - name: Verify WAV and ZIP using independent readers
        run: python3 scripts/verify_exports.py ExportFixtures && python3 scripts/verify_voice_assets.py ExportFixtures && python3 scripts/verify_performance.py ExportFixtures
      - name: Verify generated project is current
        run: python3 scripts/generate_project.py && git diff --exit-code -- LaGrilla.xcodeproj
      - name: Release configuration audit
        run: |
          python3 scripts/release/audit_release.py
          python3 scripts/release/test_native_acceptance.py
          python3 scripts/release/test_device_acceptance.py
          python3 scripts/ci/test_run_native.py
          python3 scripts/ci/test_native_scope.py
          for GRILLA_SCRIPT in scripts/release/*.sh; do bash -n "$GRILLA_SCRIPT"; done
      - name: Presentation and localization audit
        run: python3 scripts/audit_presentation.py && plutil -lint Resources/en.lproj/Localizable.strings Resources/ru.lproj/Localizable.strings
      - name: Screenshot collector regression
        run: python3 scripts/test_collect_native_screenshots.py
      - name: Audio kernel tests
        env:
          GRILLA_CXX_BIN: clang++
        run: bash scripts/test_audio.sh
      - name: Build iOS app
        id: simulator_build
        run: set -o pipefail; xcodebuild -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build-for-testing | tee build.log
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/LaGrilla.app LaGrilla-Simulator.zip
      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: |
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip
      - name: Configure virtual host microphone for native PCM
        run: bash scripts/setup_ci_audio.sh
      - name: Prepare iOS Simulator
        env:
          GRILLA_CAPTURE_SCREENS: '0'
        run: bash scripts/screenshots.sh
      - name: Native user flows
        id: native_flows
        env:
          GRILLA_REQUIRE_MIC_INPUT: '1'
          TEST_RUNNER_GRILLA_REQUIRE_MIC_INPUT: '1'
          GRILLA_UI_ONLY: ${{ contains(github.event.head_commit.message, '[ui-only]') && '1' || '0' }}
          GRILLA_INTEGRATION_ONLY: ${{ contains(github.event.head_commit.message, '[integration-only]') && '1' || '0' }}
          GRILLA_INPUT_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[input-diagnostic]') && '1' || '0' }}
          TEST_RUNNER_GRILLA_INPUT_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[input-diagnostic]') && '1' || '0' }}
          GRILLA_RU_RECAPTURE: ${{ contains(github.event.head_commit.message, '[ru-capture]') && '1' || '0' }}
          TEST_RUNNER_GRILLA_RU_RECAPTURE: ${{ contains(github.event.head_commit.message, '[ru-capture]') && '1' || '0' }}
        run: |
          set -o pipefail
          DEVICE=$(cat /tmp/grilla-simulator-id)
          SCOPE=full
          INVENTORY=(--functional-inventory UITests)
          FILTER=(-skip-testing:LaGrillaUITests/ScreenshotTests/testCaptureCompactScreens)
          if test "$GRILLA_UI_ONLY" = 1; then FILTER=(-skip-testing:LaGrillaUITests/ScreenshotTests); SCOPE=ui-only; fi
          if test "$GRILLA_INTEGRATION_ONLY" = 1; then
            FILTER=(-only-testing:LaGrillaUITests/ArrangementUITests -only-testing:LaGrillaUITests/AudioRuntimeContinuityTests -only-testing:LaGrillaUITests/DrumRuntimeContinuityTests -only-testing:LaGrillaUITests/LiveEditingTests -only-testing:LaGrillaUITests/VoiceReviewUITests)
            SCOPE=integration-only
            INVENTORY=()
          fi
          if test "$GRILLA_RU_RECAPTURE" = 1; then FILTER+=(-only-testing:LaGrillaUITests/ScreenshotTests/testCaptureStoreScreens); SCOPE=ru-capture; INVENTORY=(); fi
          if test "$GRILLA_INPUT_DIAGNOSTIC" = 1; then
            FILTER=(-only-testing:LaGrillaUITests/AudioRuntimeContinuityTests/testAAOutputOnlyLaunchDoesNotRequestMicrophone -only-testing:LaGrillaUITests/AudioRuntimeContinuityTests/testSessionMicrophoneLeaseRetainsLiveEngineAndPCM -only-testing:LaGrillaUITests/AudioRuntimeContinuityTests/testProductionVoiceCaptureCAFAnalysisApplyStoreAndUndo -only-testing:LaGrillaUITests/AudioRuntimeContinuityTests/testDiagnosticOnlyFreshInputLifecycleControls)
            SCOPE=input-diagnostic
            INVENTORY=()
          fi
          python3 scripts/ci/run_native.py --timeout-seconds 3600 --deadline-env GRILLA_NATIVE_DEADLINE_EPOCH --label full-native-ui --scope "$SCOPE" "${INVENTORY[@]}" --log uitests.log --status native-process-status.json -- xcodebuild "${FILTER[@]}" -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test-without-building
      - name: Preserve exact-source functional scope receipt
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-scope
          path: native-process-status.json
      - name: Preserve native crash reports and partial device log
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p CrashReports
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*LaGrilla*' -exec cp {} CrashReports/ \; || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          device_file=Path('/tmp/grilla-simulator-id')
          if device_file.exists():
              with Path('native-device.log').open('wb') as output:
                  try:
                      result=subprocess.run(['xcrun','simctl','spawn',device_file.read_text().strip(),'log','show','--last','20m','--style','compact','--predicate','process == "LaGrilla"'],stdout=output,stderr=subprocess.STDOUT,timeout=45)
                      output.write(f'\nDiagnostic command exit: {result.returncode}\n'.encode())
                  except subprocess.TimeoutExpired:
                      output.write(b'\nDevice diagnostic timed out; original partial output retained.\n')
          PY
      - name: Upload original native process evidence before later captures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: native-process-evidence
          path: |
            uitests.log
            native-process-status.json
            native-device.log
            ci-audio.log
            TestResults.xcresult
            CrashReports
      - name: Record read-only host microphone authorization diagnostics
        if: always() && !cancelled() && contains(github.event.head_commit.message, '[input-diagnostic]')
        timeout-minutes: 1
        run: |
          set -o pipefail
          bash scripts/log_ci_audio_tcc.sh | tee -a ci-audio.log
      - name: Compact iPhone screenshots
        if: always() && !cancelled() && !contains(github.event.head_commit.message, '[input-diagnostic]') && steps.simulator_build.outcome == 'success' && (!contains(github.event.head_commit.message, '[ui-only]') || contains(github.event.head_commit.message, '[ru-capture]') || contains(github.event.head_commit.message, '[compact-capture]'))
        env:
          GRILLA_RU_RECAPTURE: ${{ contains(github.event.head_commit.message, '[ru-capture]') && '1' || '0' }}
          TEST_RUNNER_GRILLA_RU_RECAPTURE: ${{ contains(github.event.head_commit.message, '[ru-capture]') && '1' || '0' }}
        run: python3 scripts/ci/run_native.py --timeout-seconds 900 --deadline-env GRILLA_NATIVE_DEADLINE_EPOCH --label compact-native-capture --log compact-supervisor.log --status compact-process-status.json -- bash scripts/compact_screenshots.sh
      - name: Export native QA screenshots
        if: always() && !cancelled()
        timeout-minutes: 2
        env:
          GRILLA_CAPTURE_OPTION: ${{ (contains(github.event.head_commit.message, '[input-diagnostic]') || (contains(github.event.head_commit.message, '[ui-only]') && !contains(github.event.head_commit.message, '[ru-capture]'))) && '--allow-empty' || '' }}
        run: |
          GRILLA_ATTACHMENTS_FAILED=0
          if test -d TestResults.xcresult; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path NativeAttachments/main || GRILLA_ATTACHMENTS_FAILED=1
          fi
          if test -d CompactResults.xcresult; then
            xcrun xcresulttool export attachments --path CompactResults.xcresult --output-path NativeAttachments/compact || GRILLA_ATTACHMENTS_FAILED=1
          fi
          python3 scripts/collect_native_screenshots.py NativeAttachments Screenshots/OriginalVision OriginalVision --replace-pngs "$GRILLA_CAPTURE_OPTION" || GRILLA_ATTACHMENTS_FAILED=1
          # Preserve every valid original even when another result bundle is
          # corrupt. The step/run still fails; a partial set cannot authorize
          # Store preparation or distribution.
          exit "$GRILLA_ATTACHMENTS_FAILED"
      - name: Prepare validated App Store screenshots
        if: success() && !contains(github.event.head_commit.message, '[input-diagnostic]') && (!contains(github.event.head_commit.message, '[ui-only]') || contains(github.event.head_commit.message, '[ru-capture]'))
        run: python3 scripts/release/prepare_store_screenshots.py Screenshots/OriginalVision Screenshots/AppStore
      - name: Save simulator screenshots
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: Screenshots/**/*.png
      - name: Collect app crash reports
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p CrashReports
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*LaGrilla*' -exec cp {} CrashReports/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: ios-verification
          path: |
            Screenshots/**/*.png
            ExportFixtures
            build.log
            uitests.log
            native-process-status.json
            native-device.log
            compact-supervisor.log
            compact-process-status.json
            compact-tests.log
            ci-audio.log
            TestResults.xcresult
            CompactResults.xcresult
            CrashReports
            NativeAttachments
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip

  iphone:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify current App Store toolchain
        run: python3 scripts/release/assert_sdk.py
      - name: Compile for physical iPhone SDK without signing
        run: |
          set -o pipefail
          xcodebuild -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath DeviceDerivedData CODE_SIGNING_ALLOWED=NO build | tee iphone-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-build-log
          path: iphone-build.log

  release-archive:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify current App Store toolchain
        run: python3 scripts/release/assert_sdk.py
      - name: Archive optimized iPhone binary and validate bundled resources
        run: bash scripts/release/archive_unsigned.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-release-archive
          path: |
            ReleaseArtifacts/LaGrilla-unsigned-archive.zip
            ReleaseArtifacts/*.log
            ReleaseArtifacts/*-uuid.txt
