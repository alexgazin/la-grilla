name: iOS build and verification
on: [push, workflow_dispatch]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: "!contains(github.event.head_commit.message, '[device-only]')"
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Domain behavioral tests
        env:
          GRILLA_VOICE_METRICS: ${{ github.workspace }}/ExportFixtures/voice-metrics.json
          GRILLA_VOICE_FIXTURES: ${{ github.workspace }}/ExportFixtures
          GRILLA_EXPORT_FIXTURES: ${{ github.workspace }}/ExportFixtures
        run: swift test --package-path Packages/MusicDomain
      - name: Verify WAV and ZIP using independent readers
        run: python3 scripts/verify_exports.py ExportFixtures && python3 scripts/verify_voice_assets.py ExportFixtures
      - name: Verify generated project is current
        run: python3 scripts/generate_project.py && git diff --exit-code -- LaGrilla.xcodeproj
      - name: Audio kernel tests
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/kernel_test.cpp Packages/MusicDomain/Sources/AudioDSP/GrillaKernel.cpp -I Packages/MusicDomain/Sources/AudioDSP/include -o /tmp/kernel-test && /tmp/kernel-test
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/performance_fx_test.cpp -I Packages/MusicDomain/Sources/AudioDSP -o /tmp/perf-fx-test && /tmp/perf-fx-test
      - name: Build iOS app
        run: set -o pipefail; xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tee build.log
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/LaGrilla.app LaGrilla-Simulator.zip
      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: |
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip
      - name: Capture simulator screens
        run: bash scripts/screenshots.sh
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: Screenshots/**/*.png
      - name: Native user flows
        run: |
          set -o pipefail
          DEVICE=$(cat /tmp/grilla-simulator-id)
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test | tee uitests.log
      - name: Collect app crash reports
        if: always()
        run: |
          mkdir -p CrashReports
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*LaGrilla*' -exec cp {} CrashReports/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: |
            Screenshots/**/*.png
            ExportFixtures
            build.log
            uitests.log
            TestResults.xcresult
            CrashReports
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip

  iphone:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile for physical iPhone SDK without signing
        run: |
          set -o pipefail
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath DeviceDerivedData CODE_SIGNING_ALLOWED=NO build | tee iphone-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-build-log
          path: iphone-build.log
