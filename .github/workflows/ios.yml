name: iOS build and verification
on: [push, workflow_dispatch]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: "!contains(github.event.head_commit.message, '[device-only]')"
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Domain behavioral tests
        env:
          GRILLA_VOICE_METRICS: ${{ github.workspace }}/ExportFixtures/voice-metrics.json
          GRILLA_VOICE_FIXTURES: ${{ github.workspace }}/ExportFixtures
          GRILLA_EXPORT_FIXTURES: ${{ github.workspace }}/ExportFixtures
        run: swift test --package-path Packages/MusicDomain
      - name: Verify WAV and ZIP using independent readers
        run: python3 scripts/verify_exports.py ExportFixtures && python3 scripts/verify_voice_assets.py ExportFixtures && python3 scripts/verify_performance.py ExportFixtures
      - name: Verify generated project is current
        run: python3 scripts/generate_project.py && git diff --exit-code -- LaGrilla.xcodeproj
      - name: Release configuration audit
        run: python3 scripts/release/audit_release.py
      - name: Presentation and localization audit
        run: python3 scripts/audit_presentation.py && plutil -lint Resources/en.lproj/Localizable.strings Resources/ru.lproj/Localizable.strings
      - name: Audio kernel tests
        env:
          GRILLA_CXX_BIN: clang++
        run: bash scripts/test_audio.sh
      - name: Build iOS app
        id: simulator_build
        run: set -o pipefail; xcodebuild -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build-for-testing | tee build.log
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/LaGrilla.app LaGrilla-Simulator.zip
      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: |
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip
      - name: Prepare iOS Simulator
        env:
          GRILLA_CAPTURE_SCREENS: '0'
        run: bash scripts/screenshots.sh
      - name: Native user flows
        env:
          GRILLA_UI_ONLY: ${{ contains(github.event.head_commit.message, '[ui-only]') && '1' || '0' }}
        run: |
          set -o pipefail
          DEVICE=$(cat /tmp/grilla-simulator-id)
          FILTER=(-skip-testing:LaGrillaUITests/ScreenshotTests/testCaptureCompactScreens)
          if test "$GRILLA_UI_ONLY" = 1; then FILTER=(-only-testing:LaGrillaUITests/StudioTests); fi
          xcodebuild "${FILTER[@]}" -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test-without-building | tee uitests.log
      - name: Compact iPhone screenshots
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success' && !contains(github.event.head_commit.message, '[ui-only]')
        run: bash scripts/compact_screenshots.sh
      - name: Export native QA screenshots
        if: always() && !cancelled()
        env:
          GRILLA_CAPTURE_OPTION: ${{ contains(github.event.head_commit.message, '[ui-only]') && '--allow-empty' || '' }}
        run: |
          if test -d TestResults.xcresult; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path NativeAttachments/main
          fi
          if test -d CompactResults.xcresult; then
            xcrun xcresulttool export attachments --path CompactResults.xcresult --output-path NativeAttachments/compact
          fi
          python3 scripts/collect_native_screenshots.py NativeAttachments Screenshots/R10 R10 "$GRILLA_CAPTURE_OPTION"
      - name: Prepare validated App Store screenshots
        if: success() && !contains(github.event.head_commit.message, '[ui-only]')
        run: python3 scripts/release/prepare_store_screenshots.py Screenshots/R10 Screenshots/AppStore
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: Screenshots/**/*.png
      - name: Collect app crash reports
        if: always()
        run: |
          mkdir -p CrashReports
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*LaGrilla*' -exec cp {} CrashReports/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: |
            Screenshots/**/*.png
            ExportFixtures
            build.log
            uitests.log
            TestResults.xcresult
            CompactResults.xcresult
            CrashReports
            NativeAttachments
            LaGrilla.xcodeproj
            LaGrilla-Simulator.zip

  iphone:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile for physical iPhone SDK without signing
        run: |
          set -o pipefail
          xcodebuild -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath DeviceDerivedData CODE_SIGNING_ALLOWED=NO build | tee iphone-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-build-log
          path: iphone-build.log

  release-archive:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive optimized iPhone binary and validate bundled resources
        run: bash scripts/release/archive_unsigned.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-release-archive
          path: |
            ReleaseArtifacts/LaGrilla-unsigned-archive.zip
            ReleaseArtifacts/*.log
            ReleaseArtifacts/*-uuid.txt
