name: Native Design 26 presentation and interaction verification
on:
  push:
    branches: [feat/design26]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-design26-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  native-design26:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Reserve original evidence preservation time
        run: |
          python3 - <<'PYTIME'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'GRILLA_DESIGN26_DEADLINE_EPOCH={time.time()+35*60}\n')
          PYTIME
      - uses: actions/checkout@v4
      - name: Verify exact source and build the original generated project
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 - <<'PYIDENTITY'
          import hashlib,json,os,pathlib,subprocess
          def value(args):return subprocess.check_output(args,text=True,timeout=30).strip()
          source=pathlib.Path('App/Theme.swift').read_bytes()
          receipt=dict(repository=os.environ['GITHUB_REPOSITORY'],sourceSHA=os.environ['GITHUB_SHA'],checkoutSHA=value(['git','rev-parse','HEAD']),runID=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],architecture=value(['uname','-m']),runnerArchitecture=os.environ['RUNNER_ARCH'],xcode=value(['xcodebuild','-version']),simulatorSDK=value(['xcrun','--sdk','iphonesimulator','--show-sdk-version']),themeSHA256=hashlib.sha256(source).hexdigest(),scope='focused-design26',fullAcceptance=False,physicalDevice=False,customVideoCapture=False)
          pathlib.Path('design26-source.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert receipt['sourceSHA']==receipt['checkoutSHA']
          assert receipt['architecture']=='arm64' and receipt['runnerArchitecture']=='ARM64'
          assert receipt['xcode'].splitlines()[0]=='Xcode 26.3' and receipt['simulatorSDK']=='26.2'
          PYIDENTITY
          python3 scripts/generate_project.py
          git diff --exit-code -- LaGrilla.xcodeproj
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build-for-testing 2>&1 | tee design26-build.log
      - name: Configure actual host audio for existing sound regressions
        timeout-minutes: 5
        run: bash scripts/setup_ci_audio.sh
      - name: Boot the selected native iPhone Simulator without ad hoc capture
        timeout-minutes: 7
        env:
          GRILLA_CAPTURE_SCREENS: '0'
        run: bash scripts/screenshots.sh
      - name: Capture Night and Light and verify focused native interactions
        timeout-minutes: 26
        run: |
          python3 - <<'PYRUN'
          import json,pathlib,subprocess
          cases=[
              'DesignPresentationTests/testNightSurfacesRemainReachableWithoutEditingMusic',
              'DesignPresentationTests/testLightSurfacesRemainReachableWithoutEditingMusic',
              'PadTouchUITests/testContactEnqueuesBeforeReleaseAndHoldDoesNotRetrigger',
              'PadTouchUITests/testSlidingFingerKeepsItsOriginalPadAndNeverStrikesNeighbour',
              'PianoTouchUITests/testHoldAndMoveKeepsDurationAndCommitsOneUndoableEdit',
              'PianoTouchUITests/testResizeHandleUsesGridAndCommitsOneUndoableEdit',
              'SoundPickerUITests/testAppliedSoundIsOneUndoAndPersistsInTheRealStore',
              'SoundPickerUITests/testLiveSoundPreviewRetainsTheGrooveAndSourceRevision',
              'SoundPickerUITests/testSoundPreviewHasActualOutputAndCancelKeepsMusicUntouched',
              'StudioTests/testLandscapeKeepsPadsAndTransportReachable',
              'StudioTests/testLargeTypeMixerAndAccessibleNoteList',
          ]
          selection=dict(scope='focused-design26',selectedCases=cases,expectedCount=len(cases),maximumExecutionTimeAllowance=120,fullAcceptance=False,physicalDevice=False)
          pathlib.Path('design26-selection.json').write_text(json.dumps(selection,indent=2)+'\n')
          device=pathlib.Path('/tmp/grilla-simulator-id').read_text().strip()
          command=['python3','scripts/ci/run_native.py','--timeout-seconds','1500','--deadline-env','GRILLA_DESIGN26_DEADLINE_EPOCH','--scope','focused','--label','design26-presentation-and-interactions','--log','design26-native.log','--status','design26-process-status.json']
          for identifier in cases:command+=['--require-test',identifier]
          command+=['--','xcodebuild','-project','LaGrilla.xcodeproj','-scheme','LaGrilla','-destination','platform=iOS Simulator,id='+device,'-derivedDataPath','DerivedData','-resultBundlePath','Design26Results.xcresult','-parallel-testing-enabled','NO']
          for identifier in cases:command+=['-only-testing:LaGrillaUITests/'+identifier]
          command+=['-test-timeouts-enabled','YES','-maximum-test-execution-time-allowance','120','ARCHS=arm64','ONLY_ACTIVE_ARCH=YES','CODE_SIGN_IDENTITY=-','CODE_SIGNING_REQUIRED=NO','test-without-building']
          raise SystemExit(subprocess.call(command))
          PYRUN
      - name: Preserve original app crash and device diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          python3 - <<'PYDIAGNOSTICS'
          import pathlib,shutil,subprocess
          output=pathlib.Path('Design26CrashReports');output.mkdir(exist_ok=True)
          directory=pathlib.Path.home()/'Library/Logs/DiagnosticReports'
          if directory.exists():
              for item in directory.glob('*LaGrilla*'):
                  if item.is_file():shutil.copy2(item,output/item.name)
          selected=pathlib.Path('/tmp/grilla-simulator-id')
          if selected.exists():
              with pathlib.Path('design26-device.log').open('wb') as stream:
                  try:
                      result=subprocess.run(['xcrun','simctl','spawn',selected.read_text().strip(),'log','show','--last','30m','--style','compact','--predicate','process == "LaGrilla"'],stdout=stream,stderr=subprocess.STDOUT,timeout=45)
                      stream.write(f'\nDevice log command exit: {result.returncode}\n'.encode())
                  except subprocess.TimeoutExpired:stream.write(b'\nDevice log timed out; original partial bytes retained.\n')
          PYDIAGNOSTICS
      - name: Preserve original XCTest attachments and named PNG copies
        if: always()
        timeout-minutes: 3
        run: |
          set -o pipefail
          GRILLA_DESIGN26_EXPORT_STATUS=0
          if test -d Design26Results.xcresult; then
            xcrun xcresulttool export attachments --path Design26Results.xcresult --output-path Design26Attachments || GRILLA_DESIGN26_EXPORT_STATUS=$?
          fi
          python3 scripts/collect_native_screenshots.py Design26Attachments Screenshots/Design26 Design26 --replace-pngs --allow-empty
          python3 - <<'PYCAPTURE'
          import hashlib,json,pathlib
          root=pathlib.Path('Screenshots/Design26')
          files=sorted(root.glob('*.png')) if root.exists() else []
          expected={appearance+'-'+surface+'.png' for appearance in ['night','light'] for surface in ['grid','jam','mixer','piano','sound']}
          actual={item.name for item in files}
          receipt=dict(expected=sorted(expected),actual=sorted(actual),complete=expected.issubset(actual),originalAttachments='Design26Attachments',originalResult='Design26Results.xcresult',images={item.name:hashlib.sha256(item.read_bytes()).hexdigest() for item in files},fullAcceptance=False)
          pathlib.Path('design26-capture.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert receipt['complete'],'Missing original native Design26 PNG attachments: '+', '.join(sorted(expected-actual))
          PYCAPTURE
          exit "$GRILLA_DESIGN26_EXPORT_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: design26-native-verification
          path: |
            design26-source.json
            design26-build.log
            design26-native.log
            design26-process-status.json
            design26-selection.json
            design26-capture.json
            design26-device.log
            Design26CrashReports
            ci-audio.log
            Design26Results.xcresult
            Design26Attachments
            Screenshots/Design26
