name: SoundFont and sample audio
on:
  push:
    branches: [main, feat/sample-instruments, feat/sound-library]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sampler:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify native sampler, portable zones and WAV output using a real bank
        shell: bash
        run: |
          TEMP_BANK=$(mktemp -d)
          BANK=$(bash scripts/ci/fetch_test_sound_bank.sh "$TEMP_BANK")
          mkdir "$TEMP_BANK/Verify"
          cp AudioRuntime/{SoundFontProgramTable,SoundBankLibrary,InstrumentPreparation,StarterDrumKit}.swift scripts/verify_sound_bank_preview.swift "$TEMP_BANK/Verify/"
          cat > "$TEMP_BANK/Package.swift" <<EOF
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(name: "Verify", platforms: [.macOS(.v13)],
              dependencies: [.package(name: "MusicDomain", path: "$GITHUB_WORKSPACE/Packages/MusicDomain")],
              targets: [.executableTarget(name: "Verify", dependencies: [.product(name: "MusicDomain", package: "MusicDomain")], path: "Verify")])
          EOF
          xcrun swift run --package-path "$TEMP_BANK" Verify "$BANK"
  ios-sound:
    if: github.ref_name == 'feat/sample-instruments' || github.ref_name == 'feat/sound-library' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build app and tests for iPhone Simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild -project LaGrilla.xcodeproj -scheme LaGrilla -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build-for-testing | tee sound-build.log
      - name: Boot iPhone and seed a test-only bank
        timeout-minutes: 8
        env:
          GRILLA_CAPTURE_SCREENS: '0'
        run: |
          bash scripts/screenshots.sh
          DEVICE=$(cat /tmp/grilla-simulator-id)
          BANK=$(bash scripts/ci/fetch_test_sound_bank.sh "$(mktemp -d)")
          xcrun simctl install "$DEVICE" DerivedData/Build/Products/Debug-iphonesimulator/LaGrilla.app
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.alexgazin.LaGrilla data)
          DESTINATION="$DATA/Library/Application Support/SoundBanks/9024816D-3752-4DDB-B9CF-1C236482680A"
          mkdir -p "$DESTINATION"
          cp "$BANK" "$DESTINATION/"
          python3 - "$DATA/Library/Application Support/PadSamples" <<'PY'
          import hashlib,json,pathlib,struct,sys
          identity='326FA160-F668-4DEB-B58F-A9B24B5E4086'
          root=pathlib.Path(sys.argv[1])/identity
          root.mkdir(parents=True,exist_ok=True)
          frames=1920
          values=[int((4000 if i%80<40 else -4000)*(frames-i)/frames) for i in range(frames)]
          audio=b'LGS1'+struct.pack('<IIIII',32000,1,60,frames,0)+struct.pack('<'+'h'*frames,*values)
          (root/'sound.lgpcm').write_bytes(audio)
          (root/'sample.json').write_text(json.dumps(dict(id=identity,kind='oneShot',name='Studio Click',byteCount=len(audio),sha256=hashlib.sha256(audio).hexdigest())))
          PY
      - name: Verify kit, library reuse, instrument search and timeline pinch
        timeout-minutes: 11
        env:
          TEST_RUNNER_GRILLA_TEST_SOUNDFONT: '1'
        run: |
          DEVICE=$(cat /tmp/grilla-simulator-id)
          CASES=(ArrangementUITests/testPinchRetainsScrolledMusicalCenterWithoutEditingOrStopping SoundPickerUITests/testPocketKitIsAnUndoableEditAndReopensWithTheSamePadSamples SoundPickerUITests/testSavedPadSampleCanBeUsedInTwoProjects SoundPickerUITests/testLiveSoundPreviewRetainsTheGrooveAndSourceRevision)
          REQUIRED=()
          SELECTED=()
          for CASE_ID in "${CASES[@]}"; do
            REQUIRED+=(--require-test "$CASE_ID")
            SELECTED+=("-only-testing:LaGrillaUITests/$CASE_ID")
          done
          python3 scripts/ci/run_native.py --timeout-seconds 570 --scope focused --label sample-audio "${REQUIRED[@]}" --log sound-native.log --status sound-native-status.json -- xcodebuild "${SELECTED[@]}" -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 210 -project LaGrilla.xcodeproj -scheme LaGrilla -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath SoundResults.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test-without-building
      - name: Export original screenshots
        if: always()
        run: |
          if test -f SoundResults.xcresult/Info.plist; then
            xcrun xcresulttool export attachments --path SoundResults.xcresult --output-path SoundAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-native-verification
          path: |
            sound-build.log
            sound-native.log
            sound-native-status.json
            SoundAttachments
