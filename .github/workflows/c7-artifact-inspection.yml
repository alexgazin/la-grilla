name: Preserve original C7 artifact ZIP bytes
on:
  push:
    branches: [verify/c7-artifact-inspection]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
env:
  # Coordinator fills these from the ORIGINAL actual API record before commit.
  SOURCE_ARTIFACT_ID: 14179907862
  SOURCE_RUN_ID: 43754981384
  SOURCE_SHA: 0de6677bb946e0ed749a00d0a34355832bdf4f7a
  EXPECTED_ORIGINAL_DIGEST: sha256:f142cbcf258eff4705fa4c95fc648ccf4d8b72a923bf86af4bf9f7a9f5bb1a6c
  EXPECTED_ORIGINAL_BYTES: 557287135
jobs:
  raw-original-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original ZIP and split unchanged bytes
        id: split
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/raw_artifact_transport.py download \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-run "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/RawArtifactParts"
          python3 - <<'PY'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'RawArtifactParts/manifest.json').read_text())
          origin=receipt['original_artifact']
          assert origin['digest']==os.environ['EXPECTED_ORIGINAL_DIGEST']
          assert origin['size_in_bytes']==int(os.environ['EXPECTED_ORIGINAL_BYTES'])
          print('Pinned original API digest and size match the verified raw download.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ env.SOURCE_ARTIFACT_ID }}-origin
          path: ${{ runner.temp }}/RawArtifactParts/manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.split.outputs.has_part_000 == 'true' }}
        with:
          name: raw-${{ env.SOURCE_ARTIFACT_ID }}-part-000
          path: ${{ runner.temp }}/RawArtifactParts/part-000/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.split.outputs.has_part_001 == 'true' }}
        with:
          name: raw-${{ env.SOURCE_ARTIFACT_ID }}-part-001
          path: ${{ runner.temp }}/RawArtifactParts/part-001/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.split.outputs.has_part_002 == 'true' }}
        with:
          name: raw-${{ env.SOURCE_ARTIFACT_ID }}-part-002
          path: ${{ runner.temp }}/RawArtifactParts/part-002/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.split.outputs.has_part_003 == 'true' }}
        with:
          name: raw-${{ env.SOURCE_ARTIFACT_ID }}-part-003
          path: ${{ runner.temp }}/RawArtifactParts/part-003/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
