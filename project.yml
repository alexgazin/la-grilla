name: LaGrilla
options:
  bundleIdPrefix: com.alexgazin
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.3'
packages:
  MusicDomain:
    path: Packages/MusicDomain
settings:
  base:
    SWIFT_VERSION: '6.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  LaGrilla:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - AudioRuntime
      - Resources
    dependencies:
      - package: MusicDomain
        product: MusicDomain
      - package: MusicDomain
        product: AudioDSP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexgazin.LaGrilla
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: La Grilla
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '15'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LaGrillaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LaGrilla
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexgazin.LaGrillaUITests
        TEST_TARGET_NAME: LaGrilla
  LaGrillaDemoTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Demos/NativeDemoTests.swift]
    dependencies:
      - target: LaGrilla
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexgazin.LaGrillaDemoTests
        TEST_TARGET_NAME: LaGrilla
schemes:
  LaGrilla:
    build:
      targets:
        LaGrilla: all
    test:
      targets: [LaGrillaUITests]
    run:
      config: Debug
    archive:
      config: Release
  LaGrillaDemo:
    build:
      targets:
        LaGrilla: all
    test:
      targets: [LaGrillaDemoTests]
    run:
      config: Debug
